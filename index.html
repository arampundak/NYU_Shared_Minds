<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Minds — Aram Pundak</title>
  <style>
    :root { --ink: #111; --dim: #777; --line: #e6e6e6; --bg: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #eee; --dim: #999; --line: #2a2a2a; --bg: #111; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 17px/1.5 system-ui, -apple-system, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: var(--dim); margin: 4px 0 40px; }
    ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a { display: flex; gap: 16px; padding: 16px 0; color: inherit; text-decoration: none; }
    a:hover .title { text-decoration: underline; }
    .week { color: var(--dim); min-width: 5.5em; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Shared Minds — Aram Pundak</h1>
    <p class="sub">NYU ITP/IMA, Fall 2026</p>
    <ol id="weeks"></ol>
  </main>

  <script>
    // Add one line per week: [week number, folder, title]
    const WEEKS = [
      [1, "01-talking-journal",   "Talking Journal"],
      [2, "02-not-submitted",     "Not Submitted"],
      [3, "03-implicit-explicit", "Implicit / Explicit: Faceted Self"],
    ];

    const list = document.getElementById("weeks");
    for (const [n, folder, title] of WEEKS) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = folder + "/";
      a.innerHTML = `<span class="week">Week ${n}</span><span class="title"></span>`;
      a.querySelector(".title").textContent = title;
      li.appendChild(a);
      list.appendChild(li);
    }
  </script>
</body>
</html>
