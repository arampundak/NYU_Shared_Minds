<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doors of Perception: bots</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #log { list-style: none; padding: 0; font-size: 0.85rem; }
    #log li { margin: 0.2rem 0; }
    #log li.ok { color: #1a7f37; }
    #log li.fail { color: #c62828; }
    #personas { font-size: 0.85rem; color: #555; }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>The god button</h1>
  <p class="subtitle">Six bots write thoughts. Each one becomes a room, built exactly like yours and labelled as a bot.</p>

  <ul id="personas"></ul>

  <div class="row">
    <label>Rooms to add <input id="count" type="number" min="1" max="60" value="30" style="width: 5rem"></label>
    <button id="go" type="button">Seed the world</button>
    <button id="stop" type="button" disabled>Stop</button>
    <strong id="progress"></strong>
  </div>
  <p class="subtitle">Three rooms are built at a time and each takes about a minute, so 30 rooms is roughly 10 to 15 minutes. Keep this tab open.</p>

  <ul id="log"></ul>

  <script type="module" src="js/bots.js"></script>
</body>
</html>
